name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run checks
        run: |
          for f in $(find . -name "*.sh" -not -path "./.git/*"); do echo "bash -n $f"; bash -n "$f"; done
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run checks
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD:/workspace:ro" -w /workspace koalaman/shellcheck-alpine:v0.10.0 -es <<'SHELLCHECK_SCRIPT'
          shellcheck -S warning $(find . -name "*.sh" -not -path "./.git/*")
          SHELLCHECK_SCRIPT
  yaml-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run checks
        run: |
          pip install --no-cache-dir --quiet pyyaml==6.0.2
          python - <<'PY'
          import pathlib, yaml
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(p.read_text())
              print("parses:", p)
          for p in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = p.read_text()
              assert text.startswith("---\n"), f"{p}: missing front matter"
              meta = yaml.safe_load(text.split("---\n", 2)[1])
              for key in ("name", "description"):
                  assert meta.get(key), f"{p}: front matter has no {key}"
              print("front matter ok:", p)
          PY
